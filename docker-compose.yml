version: '3.8'

services:
  # =========================================================
  # 🌾 Vanijya Unified Platform (Backend + Frontend)
  # =========================================================
  vanijya-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanijya-platform
    restart: unless-stopped
    ports:
      - "3000:3000" # Web Portal
      - "4000:4000" # Backend API & Swagger Docs
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=vanijya_super_secret_jwt_key_sih2024
      - DATABASE_URL=postgresql://vanijya_user:vanijya_secure_pass_2026@postgres:5432/vanijya_db?schema=public
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vanijya-network

  # =========================================================
  # 🐘 PostgreSQL Database
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: vanijya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanijya_user
      POSTGRES_PASSWORD: vanijya_secure_pass_2026
      POSTGRES_DB: vanijya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanijya_user -d vanijya_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vanijya-network

volumes:
  postgres_data:
    driver: local

networks:
  vanijya-network:
    driver: bridge
