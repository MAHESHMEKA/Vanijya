version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanijya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanijya_user
      POSTGRES_PASSWORD: vanijya_pass
      POSTGRES_DB: vanijya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanijya_user -d vanijya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanijya-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://vanijya_user:vanijya_pass@postgres:5432/vanijya_db?schema=public
      JWT_SECRET: vanijya_super_secret_jwt_key_sih2024
      JWT_EXPIRES_IN: 7d
      MARKET_DATA_PROVIDER: mock
      PRICE_CACHE_TTL_MS: 300000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vanijya-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
