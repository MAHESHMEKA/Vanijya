services:
  # -------------------------------------------------------------
  # Vanijya Backend API (NestJS)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vanijya-backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - JWT_SECRET=vanijya_super_secret_jwt_key_sih2024
      - DATABASE_URL=postgresql://vanijya_user:vanijya_pass@postgres:5432/vanijya_db?schema=public
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------
  # Vanijya Web Portal (Next.js 14)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: vanijya-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # Optional: PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vanijya-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=vanijya_user
      - POSTGRES_PASSWORD=vanijya_pass
      - POSTGRES_DB=vanijya_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
