version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vanijya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vanijya_user
      POSTGRES_PASSWORD: vanijya_pass
      POSTGRES_DB: vanijya_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanijya_user -d vanijya_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
